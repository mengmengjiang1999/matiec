name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gcc-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake bison flex g++ libfl-dev make

      - name: Bootstrap
        run: autoreconf --install

      - name: Configure for GCC
        run: CC=gcc CXX=g++ ./configure

      - name: Build
        run: make --jobs=2

      - name: Run regressions
        run: make check

  clang-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: brew install autoconf automake bison flex

      - name: Select Homebrew parser tools
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Bootstrap
        run: autoreconf --install

      - name: Configure for Clang
        run: CC=clang CXX=clang++ ./configure

      - name: Build
        run: make --jobs=2

      - name: Run regressions
        run: make check
