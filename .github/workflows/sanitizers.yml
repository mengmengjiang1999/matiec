name: sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizer-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer and LeakSanitizer
            target: asan
          - name: UndefinedBehaviorSanitizer
            target: ubsan
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake bison flex g++ libfl-dev make

      - name: Run sanitizer regressions
        run: make check-${{ matrix.target }}
